name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # `check` builds the packages first (types come from dist/), then runs format, lint,
      # types, tests and attw.
      - name: Check
        run: bun run check

      - name: Build demo
        run: bun run --cwd apps/demo build
