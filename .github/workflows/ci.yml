name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Packages export from dist/; typecheck needs a prior build (same as local after build:packages).
      - name: Build packages
        run: bun run build:packages

      - name: Check
        run: bun run check

      - name: Check exports (attw)
        run: bun run check-exports

      - name: Build demo
        run: bun run --cwd apps/demo build
