name: Deploy preview (GitHub Pages)

# Pages source must be set to "GitHub Actions" in repo Settings → Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Build demo
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          bun run --cwd apps/demo build
          # GitHub Pages has no SPA fallback — serve the app for deep links too.
          cp apps/demo/dist/index.html apps/demo/dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/demo/dist

  deploy:
    name: Deploy preview (GitHub Pages)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
