# From the FMC tech-stack template, trimmed for this repo.
# Schedule: open-source repos → first Friday of the month, 07:00 Europe/Berlin.
version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /
    schedule:
      interval: cron
      cronjob: '0 7 * * FRI#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    ignore:
      # TypeScript 7 is a separate migration; stay on TS 5 for now.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
    groups:
      security-dev-tools:
        applies-to: security-updates
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
          - 'vitest*'
          - 'husky*'
          - '@types/*'
          - 'typescript'

      shared-monorepo-tools:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
          - '@types/bun'
          - '@changesets/*'

      dev-minor-patch:
        applies-to: version-updates
        patterns:
          - '@arethetypeswrong/*'
          - 'husky'
          - 'oxfmt'
          - 'oxlint*'
          - 'vitest'
          - 'vite'
          - '@types/*'
          - 'typescript'
        update-types:
          - minor
          - patch

      prod-misc-patch:
        applies-to: version-updates
        update-types:
          - patch
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 7 * * FRI#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
